<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3D-логотип з кубиків — демо</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Сірі 3D-кубики хаотично рухаються, синхронізуються й збираються в обʼємний логотип. Живе демо на Three.js.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<meta name="theme-color" content="#ebe9e5">
<style>
  :root { --bg: #ebe9e5; --ink: #8b8781; --line: rgba(60, 56, 50, .14); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(120% 95% at 50% 36%, #f7f6f3 0%, #eceae6 52%, #dcd9d3 100%);
    overflow: hidden;
    font: 500 12px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
  .tag, #replay { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); color: var(--ink); letter-spacing: .02em; }
  .tag { left: 16px; pointer-events: none; user-select: none; }
  #replay {
    right: 16px; font: inherit; color: var(--ink); background: rgba(255, 255, 255, .45);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px 7px 10px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: color .2s, background-color .2s;
  }
  #replay:hover, #replay:focus-visible { color: #4a4640; background: rgba(255, 255, 255, .8); outline: none; }
  #replay span { display: inline-block; margin-right: 5px; }
  .capture .tag, .capture #replay { display: none; }
  .nogl #replay { display: none; }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D-анімація: кубики збираються в логотип"></canvas>
<div class="tag">Демо · логотип-заглушка</div>
<button id="replay" type="button"><span aria-hidden="true">↻</span>Повторити</button>
<script type="module" src="./cubes-logo.js"></script>
</body>
</html>
